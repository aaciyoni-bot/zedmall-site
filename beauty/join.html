<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצטרפות כמטפלת — byoutoyou</title>
<meta name="description" content="הצטרפי לצוות המטפלות של byoutoyou — את קובעת מתי ואיפה לעבוד, אנחנו מביאים את הלקוחות.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Comfortaa:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    /* motion */
    --dur-1:120ms;
    --dur-2:250ms;
    --dur-3:400ms;
    --ease-out:cubic-bezier(.16,1,.3,1);
    --ease-in:cubic-bezier(.4,0,1,1);
    --ease-back:cubic-bezier(.34,1.56,.64,1);
    /* spacing scale */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
    --bg:#faf7f5;--surface:#fff;--ink:#231a26;--ink-2:#6b5f70;--ink-3:#6f6475;
    --brand:#c94f7c;--brand-dark:#a83a64;--brand-soft:#fbeef3;--green:#1fa97a;--green-soft:#e6f7f0;
    --line:#efe7ea;--shadow:0 2px 12px rgba(60,30,50,.07);--shadow-lg:0 12px 40px rgba(60,30,50,.16);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:1rem}
  .container{max-width:640px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;background:rgba(250,247,245,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .header-in{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1080px;margin:0 auto;padding:0 20px}
  .logo{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
  .logo .wordmark{font-family:'Comfortaa',system-ui,sans-serif;font-weight:700;font-size:1.85rem;letter-spacing:-1.2px;color:var(--ink);direction:ltr;unicode-bidi:isolate}
  .logo .wordmark b{font-weight:700;background:linear-gradient(90deg,#c94f7c,#8e4fc9);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo .wordmark i{font-style:normal;color:var(--brand)}
  .logo small{font-weight:600;color:var(--ink-2);font-size:.68rem;margin-top:3px;letter-spacing:.3px}
  .btn-ghost{padding:8px 16px;border-radius:99px;font-weight:600;font-size:.92rem;color:var(--ink-2);transition:.2s}
  .btn-ghost:hover{background:var(--brand-soft);color:var(--brand-dark)}
  .hero{text-align:center;padding:44px 0 10px}
  .hero h1{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:900;letter-spacing:-.5px}
  .hero h1 .grad{background:linear-gradient(90deg,#c94f7c,#8e4fc9);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:var(--ink-2);margin-top:8px;max-width:52ch;margin-inline:auto}
  .perks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0 8px}
  .perk{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:.86rem;font-weight:600;color:var(--ink-2);box-shadow:var(--shadow)}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:26px;margin:26px auto 50px}
  .wizard-steps{display:flex;gap:6px;margin-bottom:22px}
  .wstep{height:4px;flex:1;border-radius:99px;background:var(--line);transition:.3s}
  .wstep.done{background:var(--brand)}
  h2.step-title{font-size:1.2rem;font-weight:800;margin-bottom:16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-weight:700;font-size:.87rem;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);outline:none;transition:.2s;font-weight:500}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);background:#fff}
  .field.invalid input,.field.invalid select{border-color:#e5484d;background:#fff5f5}
  .field .hint{font-size:.76rem;color:var(--ink-3);margin-top:4px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:480px){.row-2{grid-template-columns:1fr}}
  .svc-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
  .svc-row input{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg);outline:none;width:100%}
  .svc-row button{color:#e5484d;font-size:1.1rem;padding:4px}
  .add-svc{color:var(--brand-dark);font-weight:700;font-size:.88rem;margin:4px 0 14px;text-decoration:underline}
  .upload{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--ink-2);font-size:.9rem;cursor:pointer;transition:.2s;margin-bottom:14px}
  .upload:hover{border-color:var(--brand)}
  .upload input{display:none}
  .upload .ok{color:var(--green);font-weight:700}
  .agreement{
    background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;
    max-height:260px;overflow-y:auto;font-size:.85rem;color:var(--ink-2);margin-bottom:16px;
  }
  .agreement h3{font-size:.95rem;color:var(--ink);margin:12px 0 4px}
  .agreement h3:first-child{margin-top:0}
  .agreement ol{padding-right:18px;display:flex;flex-direction:column;gap:6px}
  .check-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px;font-size:.9rem;cursor:pointer}
  .check-row input{width:19px;height:19px;accent-color:var(--brand);flex:none;margin-top:2px}
  .btn-row{display:flex;gap:10px;margin-top:20px}
  .btn-primary{
    background:linear-gradient(135deg,#c94f7c,#a83a64);color:#fff;font-weight:700;font-size:1rem;
    padding:14px 26px;border-radius:12px;transition:.2s;box-shadow:0 6px 18px rgba(201,79,124,.35);flex:1;
  }
  .btn-primary:hover{transform:translateY(-1px)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-secondary{background:var(--bg);border:1.5px solid var(--line);color:var(--ink-2);font-weight:700;padding:13px 22px;border-radius:12px}
  .success{text-align:center;padding:30px 10px}
  .success .big{width:90px;height:90px;border-radius:99px;background:var(--green-soft);display:grid;place-items:center;font-size:2.6rem;margin:0 auto 18px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .success h2{font-size:1.4rem;font-weight:900}
  .success p{color:var(--ink-2);margin-top:8px}
  .success .app-id{background:var(--bg);border-radius:12px;padding:10px 18px;display:inline-block;margin-top:14px;font-weight:800}
  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:99px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:.3s;z-index:200;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(50%) translateY(0)}

  /* ---------- Pass 0: foundations ---------- */
  :focus-visible{outline:2px solid var(--brand) !important;outline-offset:2px}
  :focus:not(:focus-visible){outline:none}
  .num,[data-num]{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .deco{color:#9a8fa0}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;
      animation-iteration-count:1!important;
      transition-duration:.01ms!important;
      scroll-behavior:auto!important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-in">
    <a class="logo" href="index.html"><span class="wordmark">byou<b>toyou</b><i>.</i></span><small>היופי מגיע אלייך</small></a>
    <a class="btn-ghost" href="index.html">→ חזרה לאתר</a>
  </div>
</header>

<div class="hero container">
  <h1>בואי לעבוד <span class="grad">בתנאים שלך.</span></h1>
  <p>כמו שנהגת Uber לא צריכה תחנת מוניות — את לא צריכה כיסא בסלון. אנחנו מביאים לקוחות, מנהלים יומן ותשלומים, ואת קובעת הכול.</p>
  <div class="perks">
    <span class="perk">💰 את קובעת את המחירים</span>
    <span class="perk">🗓️ את קובעת מתי לעבוד</span>
    <span class="perk">📍 את בוחרת את אזור השירות</span>
    <span class="perk">💳 תשלום מיידי לחשבונך</span>
  </div>
</div>

<div class="panel container" id="panel">
  <div class="wizard-steps"><div class="wstep done" id="ws1"></div><div class="wstep" id="ws2"></div><div class="wstep" id="ws3"></div></div>
  <div id="stepBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
const lsGet=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const lsSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

const APPS_KEY = 'byoutoyou_applications';
const CATS = {nails:'מניקור־פדיקור 💅', hair:'עיצוב שיער 💇‍♀️', makeup:'איפור 💄', brows:'גבות וריסים ✨', face:'טיפולי פנים 🧖‍♀️'};

let app = {
  name:'', phone:'', email:'', city:'', cat:'nails', years:'1-2', about:'',
  services:[{name:'', price:'', dur:''}], certFile:'', idFile:'',
  agreeTerms:false, agreeContractor:false, agreeCommission:false,
};

function setSteps(n){ ['ws1','ws2','ws3'].forEach((id,i)=>$(id).classList.toggle('done', i<n)); }

function renderStep(n){
  setSteps(n);
  if(n===1){
    $('stepBody').innerHTML = `
      <h2 class="step-title">קצת עלייך 👋</h2>
      <div class="row-2">
        <div class="field" id="fName"><label>שם מלא</label><input id="aName" value="${esc(app.name)}" placeholder="השם שלך"></div>
        <div class="field" id="fPhone"><label>טלפון</label><input id="aPhone" value="${esc(app.phone)}" type="tel" placeholder="050-0000000" dir="rtl"></div>
      </div>
      <div class="row-2">
        <div class="field" id="fEmail"><label>אימייל</label><input id="aEmail" value="${esc(app.email)}" type="email" placeholder="you@mail.com" dir="ltr" style="text-align:left"></div>
        <div class="field" id="fCity"><label>עיר מגורים</label><input id="aCity" value="${esc(app.city)}" placeholder="תל אביב"></div>
      </div>
      <div class="row-2">
        <div class="field"><label>תחום ההתמחות</label>
          <select id="aCat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${app.cat===k?'selected':''}>${v}</option>`).join('')}</select>
        </div>
        <div class="field"><label>שנות ניסיון</label>
          <select id="aYears">${['פחות משנה','1-2','3-5','6-10','10+'].map(y=>`<option ${app.years===y?'selected':''}>${y}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>ספרי עלייך בכמה מילים (יופיע בפרופיל)</label>
        <textarea id="aAbout" rows="3" placeholder="ההתמחות שלך, הסגנון שלך, מה מיוחד אצלך…">${esc(app.about)}</textarea>
      </div>
      <div class="btn-row"><button class="btn-primary" onclick="next1()">המשך</button></div>`;
  }
  if(n===2){
    $('stepBody').innerHTML = `
      <h2 class="step-title">השירותים והמחירים שלך 💰</h2>
      <p style="color:var(--ink-2);font-size:.88rem;margin-bottom:14px">את קובעת את המחירים. אפשר לעדכן בכל רגע דרך אזור המטפלת.</p>
      <div id="svcRows"></div>
      <button class="add-svc" onclick="addSvcRow()">+ הוסיפי שירות</button>
      <h2 class="step-title" style="margin-top:8px">מסמכים 📄</h2>
      <label class="upload"><input type="file" accept="image/*,.pdf" onchange="fileChosen(this,'certFile','certLabel')">
        <span id="certLabel">${app.certFile ? '<span class="ok">✓ ' + esc(app.certFile) + '</span>' : '📎 תעודת הסמכה מקצועית — לחצי להעלאה'}</span>
      </label>
      <label class="upload"><input type="file" accept="image/*,.pdf" onchange="fileChosen(this,'idFile','idLabel')">
        <span id="idLabel">${app.idFile ? '<span class="ok">✓ ' + esc(app.idFile) + '</span>' : '📎 תעודת זהות / רישיון — לחצי להעלאה'}</span>
      </label>
      <p class="hint" style="font-size:.76rem;color:var(--ink-3)">בדמו הקבצים לא נשמרים בפועל — רק שם הקובץ. בפרודקשן: העלאה מאובטחת ל-storage.</p>
      <div class="btn-row">
        <button class="btn-secondary" onclick="back(1)">חזרה</button>
        <button class="btn-primary" onclick="next2()">המשך להסכם</button>
      </div>`;
    drawSvcRows();
  }
  if(n===3){
    $('stepBody').innerHTML = `
      <h2 class="step-title">הסכם התקשרות מטפלת עצמאית ✍️</h2>
      <div class="agreement">
        <h3>1. מהות ההתקשרות</h3>
        <p>המטפלת פועלת כעצמאית (עוסקת מורשית/פטורה) ואינה עובדת של byoutoyou. הפלטפורמה מתווכת בין המטפלת ללקוחות, מנהלת הזמנות, תשלומים ושירות לקוחות.</p>
        <h3>2. עמלת פלטפורמה</h3>
        <p>מכל עסקה שמקורה בפלטפורמה תנוכה עמלה בשיעור 20% + מע"מ. יתרת התשלום מועברת לחשבון המטפלת תוך 3 ימי עסקים ממועד השלמת הטיפול.</p>
        <h3>3. התחייבויות המטפלת</h3>
        <ol>
          <li>להחזיק בתעודות הסמכה בתוקף ובביטוח אחריות מקצועית.</li>
          <li>להגיע במועד שנקבע; איחור מעל 20 דקות ללא עדכון מזכה את הלקוחה בפיצוי בהתאם למדיניות.</li>
          <li>לעבוד עם ציוד מחוטא וערכה סטרילית בהתאם להנחיות משרד הבריאות.</li>
          <li>לשמור על פרטיות הלקוחות ולא לעשות שימוש בפרטיהן מחוץ לפלטפורמה.</li>
          <li>לא לקבל תשלום ישיר מלקוחות הפלטפורמה בעקיפת מערכת התשלומים.</li>
        </ol>
        <h3>4. דירוגים ואיכות</h3>
        <p>דירוג ממוצע מתחת ל-4.2 לאורך 30 יום, או הפרות חוזרות, עלולים להוביל להשעיה זמנית או הסרה מהפלטפורמה, לאחר שימוע.</p>
        <h3>5. ביטולים</h3>
        <p>ביטול מצד המטפלת פחות מ-3 שעות לפני מועד הטיפול יחויב בדמי ביטול של 50 ₪ שיקוזזו מהתשלום הבא, למעט נסיבות מוצדקות.</p>
        <h3>6. סיום התקשרות</h3>
        <p>כל צד רשאי לסיים את ההתקשרות בהודעה של 14 יום. התחייבויות כספיות שנצברו ייפרעו במלואן.</p>
        <p style="margin-top:10px;font-size:.78rem">גרסת דמו להמחשה — הנוסח המחייב ייקבע עם עורך דין לפני השקה.</p>
      </div>
      <label class="check-row"><input type="checkbox" id="cTerms" ${app.agreeTerms?'checked':''}>
        קראתי ואני מסכימה ל<a href="legal.html" target="_blank" style="text-decoration:underline;color:var(--brand-dark)">תקנון הפלטפורמה</a> ולהסכם ההתקשרות המלא</label>
      <label class="check-row"><input type="checkbox" id="cContractor" ${app.agreeContractor?'checked':''}>
        אני מצהירה שאני פועלת כעצמאית ומחזיקה בתעודות והביטוחים הנדרשים</label>
      <label class="check-row"><input type="checkbox" id="cCommission" ${app.agreeCommission?'checked':''}>
        אני מאשרת את מבנה העמלה (20% + מע"מ) ותנאי התשלום</label>
      <div class="btn-row">
        <button class="btn-secondary" onclick="back(2)">חזרה</button>
        <button class="btn-primary" onclick="submitApp()">חתמי ושלחי בקשה ✍️</button>
      </div>`;
  }
}

function next1(){
  app.name=$('aName').value.trim(); app.phone=$('aPhone').value.trim(); app.email=$('aEmail').value.trim();
  app.city=$('aCity').value.trim(); app.cat=$('aCat').value; app.years=$('aYears').value; app.about=$('aAbout').value.trim();
  const badName=app.name.length<2, badPhone=!/^0\d{1,2}[- ]?\d{7}$/.test(app.phone.replace(/\s/g,'')),
        badEmail=!/^\S+@\S+\.\S+$/.test(app.email), badCity=app.city.length<2;
  ['fName','fPhone','fEmail','fCity'].forEach((f,i)=>$(f).classList.toggle('invalid',[badName,badPhone,badEmail,badCity][i]));
  if(badName||badPhone||badEmail||badCity){ toast('כמה פרטים חסרים או לא תקינים'); return; }
  renderStep(2);
}

function drawSvcRows(){
  $('svcRows').innerHTML = app.services.map((s,i)=>`
    <div class="svc-row">
      <input placeholder="שם השירות (למשל: לק ג'ל)" value="${esc(s.name)}" onchange="app.services[${i}].name=this.value">
      <input placeholder="מחיר ₪" type="number" min="0" value="${esc(s.price)}" onchange="app.services[${i}].price=this.value">
      <input placeholder="דקות" type="number" min="5" value="${esc(s.dur)}" onchange="app.services[${i}].dur=this.value">
      <button onclick="removeSvcRow(${i})" aria-label="הסרה">✕</button>
    </div>`).join('');
}
function addSvcRow(){ app.services.push({name:'',price:'',dur:''}); drawSvcRows(); }
function removeSvcRow(i){ if(app.services.length>1) app.services.splice(i,1); drawSvcRows(); }
function fileChosen(input, key, labelId){
  if(input.files[0]){ app[key]=input.files[0].name; $(labelId).innerHTML='<span class="ok">✓ '+esc(input.files[0].name)+'</span>'; }
}
function next2(){
  app.services = app.services.filter(s=>s.name.trim());
  if(!app.services.length){ app.services=[{name:'',price:'',dur:''}]; toast('הוסיפי לפחות שירות אחד עם מחיר'); drawSvcRows(); return; }
  if(app.services.some(s=>!s.price || +s.price<=0)){ toast('לכל שירות צריך מחיר 💰'); return; }
  renderStep(3);
}
function back(n){
  if($('cTerms')){ app.agreeTerms=$('cTerms').checked; app.agreeContractor=$('cContractor').checked; app.agreeCommission=$('cCommission').checked; }
  renderStep(n);
}

function submitApp(){
  app.agreeTerms=$('cTerms').checked; app.agreeContractor=$('cContractor').checked; app.agreeCommission=$('cCommission').checked;
  if(!app.agreeTerms || !app.agreeContractor || !app.agreeCommission){ toast('יש לאשר את שלושת הסעיפים ✍️'); return; }
  const id = 'AP-' + Math.random().toString(36).slice(2,7).toUpperCase();
  const apps = lsGet(APPS_KEY, []);
  apps.unshift({id, ...app, services: app.services.map(s=>({name:s.name, price:+s.price, dur:+s.dur||null})), createdAt: Date.now(), status:'pending'});
  lsSet(APPS_KEY, apps);
  document.querySelector('.wizard-steps').style.display='none';
  $('stepBody').innerHTML = `
    <div class="success">
      <div class="big">🎉</div>
