name: Validate Zambia iPhone shopping apps
on:
  push:
    branches: ['codex/apple-zambia-20261030']
    paths: ['mobile/**', '.github/workflows/zambia-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zambia-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const apps = JSON.parse(readFileSync('mobile/apps.json')).apps.filter(a => a.buildLane === 'physical-shopping');
          appendFileSync(process.env.GITHUB_OUTPUT, 'apps=' + JSON.stringify(apps) + '\n');
          JS
  build:
    needs: catalog
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.apps) }}
    name: iPhone - ${{ matrix.name }}
    env:
      APP_KEY: ${{ matrix.key }}
      SOURCE_DIR: ${{ github.workspace }}/web-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.sourceCommit }}
          path: web-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aaciyoni-bot/pokerten
          ref: 57ca0e30b136da282bac8b54b00bc762ddff64bb
          path: ios-template
          sparse-checkout: mobile/ios
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verify native toolchain
        run: |
          swift --version
          xcodebuild -version
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm test --prefix mobile
      - run: npm run build --prefix mobile
      - name: Configure existing Capacitor Xcode template
        working-directory: mobile
        run: |
          cp -R ../ios-template/mobile/ios ./ios
          swift scripts/configure-ios.swift
          npx cap sync ios
      - name: Compile unsigned iPhone archive
        run: |
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ matrix.key }}.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER='${{ matrix.bundleId }}' \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=1 \
            CODE_SIGNING_ALLOWED=NO archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { tail -100 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
      - name: Verify app identity and packaged assets
        run: |
          APP="$RUNNER_TEMP/${{ matrix.key }}.xcarchive/Products/Applications/App.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = '${{ matrix.bundleId }}'
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist")" = '${{ matrix.name }}'
          test -s "$APP/public/index.html"
          test -s "$APP/public/vendor/firebase.js"
          test -s "$APP/public/vendor/tailwind.css"
          test ! -e "$APP/public/admin.html"
          test ! -e "$APP/public/backend"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/${{ matrix.key }}.xcarchive" "dist/${{ matrix.key }}-UNSIGNED.xcarchive.zip"
          cp mobile/.generated/build-manifest.json dist/
          cp "$RUNNER_TEMP/xcodebuild.log" dist/
          echo 'Unsigned compile validation only. No IPA, TestFlight upload, or Apple submission.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}-iPhone-UNSIGNED
          path: dist/
          if-no-files-found: error
          retention-days: 14
