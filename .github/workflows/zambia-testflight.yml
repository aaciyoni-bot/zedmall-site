name: Sign and upload Zambia shopping apps to TestFlight
'on':
  workflow_dispatch:
    inputs:
      app:
        description: Physical-goods app to upload
        type: choice
        required: true
        default: zedmall
        options:
        - zedmall
        - zedglow
        - mwanako
        - chipazi
        - kayachi
        - zuwango
        - agromall
        - all
permissions:
  contents: read
concurrency:
  group: zambia-testflight-${{ inputs.app }}
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
    steps:
    - uses: actions/checkout@v4
    - id: matrix
      run: |
        node --input-type=module <<'JS'
        import { readFileSync, appendFileSync } from 'node:fs';
        const apps = JSON.parse(readFileSync('mobile/apps.json')).apps.filter(a => a.buildLane === 'physical-shopping' && (process.env.REQUESTED_APP === 'all' || a.key === process.env.REQUESTED_APP));
        if (!apps.length) throw new Error('No supported shopping app selected');
        appendFileSync(process.env.GITHUB_OUTPUT, 'apps=' + JSON.stringify(apps) + '\n');
        JS
      env:
        REQUESTED_APP: ${{ inputs.app }}
  build:
    needs: catalog
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.apps) }}
    name: TestFlight - ${{ matrix.name }}
    env:
      APP_KEY: ${{ matrix.key }}
      SOURCE_DIR: ${{ github.workspace }}/web-source
      APP_BUNDLE_ID: ${{ matrix.bundleId }}
      APPLE_TEAM_ID: RX38AZ3387
      APP_VERSION: '1.0'
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: ${{ matrix.repository }}
        ref: ${{ matrix.sourceCommit }}
        path: web-source
        persist-credentials: false
    - uses: actions/checkout@v4
      with:
        repository: aaciyoni-bot/pokerten
        ref: 57ca0e30b136da282bac8b54b00bc762ddff64bb
        path: ios-template
        sparse-checkout: mobile/ios
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: mobile/package-lock.json
    - name: Verify native toolchain
      run: |
        swift --version
        xcodebuild -version
    - run: npm ci --prefix mobile --no-audit --no-fund
    - run: npm test --prefix mobile
    - run: npm run build --prefix mobile
    - name: Configure existing Capacitor Xcode template
      working-directory: mobile
      run: |
        cp -R ../ios-template/mobile/ios ./ios
        swift scripts/configure-ios.swift
        npx cap sync ios
    - name: Install approved distribution signing material
      env:
        P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
        P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
        APPLE_PROFILES_JSON: ${{ secrets.APPLE_PROVISIONING_PROFILES_JSON }}
      run: |
        set -euo pipefail
        umask 077
        test -n "$P12_BASE64"
        test -n "$P12_PASSWORD"
        test -n "$APPLE_PROFILES_JSON"
        PROFILE_BASE64="$(python3 -c 'import json,os; print(json.loads(os.environ["APPLE_PROFILES_JSON"])[os.environ["APP_BUNDLE_ID"]])')"
        test -n "$PROFILE_BASE64"
        echo "::add-mask::$PROFILE_BASE64"
        printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
        printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
        security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
        python3 - <<'PY'
        import os, plistlib, pathlib, datetime
        root = pathlib.Path(os.environ['RUNNER_TEMP'])
        profile = plistlib.loads((root / 'profile.plist').read_bytes())
        team, bundle = os.environ['APPLE_TEAM_ID'], os.environ['APP_BUNDLE_ID']
        assert profile['TeamIdentifier'] == [team]
        assert profile['Entitlements']['application-identifier'] == f'{team}.{bundle}'
        assert profile['Entitlements'].get('get-task-allow') is False
        assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices')
        assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
        uuid = profile['UUID']
        for relative in ['Library/MobileDevice/Provisioning Profiles', 'Library/Developer/Xcode/UserData/Provisioning Profiles']:
            directory = pathlib.Path.home() / relative
            directory.mkdir(parents=True, exist_ok=True)
            (directory / f'{uuid}.mobileprovision').write_bytes((root / 'profile.mobileprovision').read_bytes())
        with open(os.environ['GITHUB_ENV'], 'a') as env:
            env.write(f'PROFILE_UUID={uuid}\n')
        options = {'method':'app-store-connect', 'destination':'export', 'signingStyle':'manual',
                   'teamID':team, 'signingCertificate':'Apple Distribution',
                   'provisioningProfiles':{bundle:uuid}, 'manageAppVersionAndBuildNumber':False,
                   'uploadSymbols':True}
        (root / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
        PY
        KEYCHAIN_PATH="$RUNNER_TEMP/zambia-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
        echo "::add-mask::$KEYCHAIN_PASSWORD"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" > /dev/null
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
        security list-keychains -d user -s "$KEYCHAIN_PATH"
        security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Apple Distribution'
        rm -f "$RUNNER_TEMP/distribution.p12"
    - name: Archive signed app for iPhone
      run: |
        xcodebuild -version
        xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App \
          -configuration Release -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/${APP_KEY}.xcarchive" \
          PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" MARKETING_VERSION="$APP_VERSION" \
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
    - name: Verify signed archive and bundled storefront
      run: |
        APP="$RUNNER_TEMP/${APP_KEY}.xcarchive/Products/Applications/App.app"
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "$APP_BUNDLE_ID"
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")" = 1.0
        test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
        test -s "$APP/public/index.html"
        test -s "$APP/public/vendor/firebase.js"
        test -s "$APP/public/vendor/tailwind.css"
        test ! -e "$APP/public/admin.html"
        test -s "$APP/embedded.mobileprovision"
        codesign --verify --deep --strict "$APP"
    - name: Export signed IPA for App Store Connect
      run: |
        xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/${APP_KEY}.xcarchive" \
          -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
        mkdir -p dist
        IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
        test -n "$IPA_PATH" && test -s "$IPA_PATH"
        cp "$IPA_PATH" "dist/${APP_KEY}-$APP_VERSION-$BUILD_NUMBER.ipa"
        ditto -x -k "$IPA_PATH" "$RUNNER_TEMP/ipa-verification"
        codesign --verify --deep --strict "$RUNNER_TEMP/ipa-verification/Payload/App.app"
        shasum -a 256 dist/*.ipa > dist/SHA256SUMS.txt
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.key }}-iPhone-signed-${{ github.run_number }}
        path: dist/
        if-no-files-found: error
        retention-days: 14
    - name: Validate and upload to App Store Connect
      env:
        APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        APP_STORE_CONNECT_KEY_ID: 7K6XDQ4KN9
        APP_STORE_CONNECT_ISSUER_ID: 819c35bf-256f-4a5f-9cb5-57df23a71a8c
      run: |
        set -euo pipefail
        umask 077
        test -n "$APP_STORE_CONNECT_API_KEY"
        export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/appstore-private-keys"
        mkdir -p "$API_PRIVATE_KEYS_DIR"
        trap 'rm -rf "$API_PRIVATE_KEYS_DIR"' EXIT
        printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
        IPA_PATH="dist/${APP_KEY}-$APP_VERSION-$BUILD_NUMBER.ipa"
        xcrun altool --validate-app -f "$IPA_PATH" -t ios \
          --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
        xcrun altool --upload-app -f "$IPA_PATH" -t ios \
          --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
    - name: Record remaining release work
      run: echo 'Uploaded to App Store Connect for processing. This does not submit the app for beta or App Store
        review. Verify processing, complete device testing and all release requirements in mobile/README.md.' >>
        "$GITHUB_STEP_SUMMARY"
    - name: Remove signing material from runner
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/zambia-signing.keychain-db" 2>/dev/null || true
        rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
        if [ -n "${PROFILE_UUID:-}" ]; then
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
        fi
    environment: zambia-ios
