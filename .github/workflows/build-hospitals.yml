name: Build hospital directory

# Rebuilds the byoutoyou hospital directory from the public CMS
# "Hospital General Information" dataset. CMS refreshes it quarterly, so a
# monthly run keeps the directory current without any per-visitor API calls.
on:
  schedule:
    - cron: '0 5 1 * *'   # 05:00 UTC on the 1st of each month
  workflow_dispatch:
  push:
    branches:
      - claude/byoutoyou-website-64wkpp
    paths:
      - 'scripts/build-hospitals.js'
      - '.github/workflows/build-hospitals.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ZIP centroid lookup
        run: npm install zipcodes --no-save --no-audit --no-fund

      - name: Build hospital data
        run: node scripts/build-hospitals.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A byoutoyou/data
          if git diff --cached --quiet; then
            echo "Hospital data unchanged — nothing to commit."
          else
            git commit -m "chore: refresh US hospital directory data [skip ci]"
            git push
          fi
